services:
  authentication-service:
    container_name: authentication-service
    build:
      context: ../..
      dockerfile: Services/AuthenticationService/Dockerfile
    env_file:
      - ./.env
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:${AUTH_SERVICE_CONTAINER_PORT:-8080}"
    depends_on:
      authentication-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network

  authentication-db:
    image: postgres:17-alpine
    container_name: authentication-db
    restart: unless-stopped
    env_file:
      - ../../Infrastructure/authentication-db.env
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - authentication_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  authentication_db_data:
