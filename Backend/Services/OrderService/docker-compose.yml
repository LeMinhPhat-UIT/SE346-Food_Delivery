services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: ${ORDER_SERVICE_CONTAINER_PORT:-8080}
      DATABASE_URL: postgresql://${ORDER_DB_USER:-postgres}:${ORDER_DB_PASSWORD:-order_strong_password}@${ORDER_DB_HOST:-order-db}:5432/${ORDER_DB_NAME:-order_db}
      REDIS_HOST: ${ORDER_REDIS_HOST:-order-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${ORDER_REDIS_PASSWORD:-order_redis_secure_password}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-appuser}:${RABBITMQ_DEFAULT_PASS:-app_password}@${RABBITMQ_HOST:-rabbitmq}:5672
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080/api/users}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080/api/catalog}
      DELIVERY_SERVICE_URL: ${DELIVERY_SERVICE_URL:-http://delivery-service:8080/api/deliveries}
    ports:
      - "${ORDER_SERVICE_HOST_PORT}:${ORDER_SERVICE_CONTAINER_PORT}"
    depends_on:
      - order-db
      - order-redis
      - rabbitmq
    networks:
      - backend-network

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    restart: unless-stopped
    env_file:
      - ../../Infrastructure/order-db.env
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - backend-network

  order-redis:
    image: redis:7-alpine
    container_name: order-redis
    restart: unless-stopped
    env_file:
      - ../../Infrastructure/order-redis.env
    command: ["sh", "-c", "redis-server --requirepass \"$$ORDER_REDIS_PASSWORD\""]
    ports:
      - "${ORDER_REDIS_PORT}:6379"
    volumes:
      - order_redis_data:/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  order_db_data:
  order_redis_data:
