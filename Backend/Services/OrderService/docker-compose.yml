services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ORDER_SERVICE_HOST_PORT:-8086}:${ORDER_SERVICE_CONTAINER_PORT:-8080}"
    environment:
      NODE_ENV: development
      PORT: ${ORDER_SERVICE_CONTAINER_PORT:-8080}
      DATABASE_URL: postgresql://${ORDER_DB_USER:-postgres}:${ORDER_DB_PASSWORD:-order_strong_password}@${ORDER_DB_HOST:-order-db}:5432/${ORDER_DB_NAME:-order_db}?schema=public
      REDIS_HOST: ${ORDER_REDIS_HOST:-order-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${ORDER_REDIS_PASSWORD:-order_redis_secure_password}
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-604800}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-appuser}:${RABBITMQ_DEFAULT_PASS:-app_password}@${RABBITMQ_HOST:-rabbitmq}:5672
      JWT_SECRET: ${JWT_KEY:-replace_with_strong_jwt_key}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.myapp.dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-https://api.myapp.dev}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080/api/users}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8080/api/catalog}
      DELIVERY_SERVICE_URL: ${DELIVERY_SERVICE_URL:-http://delivery-service:8080/api/deliveries}
      VNPAY_URL: ${VNPAY_URL}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL}
      VNPAY_VERSION: ${VNPAY_VERSION:-2.1.0}
      VNPAY_COMMAND: ${VNPAY_COMMAND:-pay}
      VNPAY_CURRENCY: ${VNPAY_CURRENCY:-VND}
      VNPAY_LOCALE: ${VNPAY_LOCALE:-vn}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE:-180000}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    depends_on:
      - order-db
      - order-redis
      - rabbitmq
    networks:
      - backend-network

  order-db:
    image: postgres:17-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
      POSTGRES_USER: ${ORDER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_strong_password}
    ports:
      - "${ORDER_DB_PORT:-5436}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - backend-network

  order-redis:
    image: redis:7-alpine
    container_name: order-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${ORDER_REDIS_PASSWORD:-order_redis_secure_password}"]
    ports:
      - "${ORDER_REDIS_PORT:-6380}:6379"
    volumes:
      - order_redis_data:/data
    networks:
      - backend-network

